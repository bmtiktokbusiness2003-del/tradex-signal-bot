name: TradeX Lifetime Signal Automation

on:
  schedule:
    - cron: '0 6 * * *'   # 11:30 AM SLST (Signal 1 Warning)
    - cron: '0 7 * * *'   # 12:30 PM SLST (Signal 1 Main)
    - cron: '0 9 * * *'   # 02:30 PM SLST (Signal 2 Warning)
    - cron: '0 10 * * *'  # 03:30 PM SLST (Signal 2 Main)
    - cron: '0 13 * * *'  # 06:30 PM SLST (Signal 3 Warning)
    - cron: '0 14 * * *'  # 07:30 PM SLST (Signal 3 Main)
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot requests

      - name: Trigger Signal Event
        run: |
          HOURS=$(date -u +'%H')
          
          if [ "$HOURS" -eq "06" ]; then
            python bot.py 1_warning
          elif [ "$HOURS" -eq "07" ]; then
            python bot.py 1_main
          elif [ "$HOURS" -eq "09" ]; then
            python bot.py 2_warning
          elif [ "$HOURS" -eq "10" ]; then
            python bot.py 2_main
          elif [ "$HOURS" -eq "13" ]; then
            python bot.py 3_warning
          elif [ "$HOURS" -eq "14" ]; then
            python bot.py 3_main
          else
            python bot.py 1_warning
          fi
