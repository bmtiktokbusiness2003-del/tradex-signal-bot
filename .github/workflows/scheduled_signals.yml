name: TradeX Lifetime Signal Automation

on:
  schedule:
    # 🔴 SOL Signals & Reset
    - cron: '0 6 * * *'   # 1_warning (11:30 AM SLST)
    - cron: '0 7 * * *'   # 1_main (12:30 PM SLST)
    - cron: '0 9 * * *'   # 1_reset (02:30 PM SLST)

    # 🟡 Gold Signals & Reset
    - cron: '0 9 * * *'   # 2_warning (02:30 PM SLST)
    - cron: '0 10 * * *'  # 2_main (03:30 PM SLST)
    - cron: '0 12 * * *'  # 2_reset (05:30 PM SLST)

    # 🔵 BTC Signals & Reset
    - cron: '0 13 * * *'  # 3_warning (06:30 PM SLST)
    - cron: '0 14 * * *'  # 3_main (07:30 PM SLST)
    - cron: '0 16 * * *'  # 3_reset (09:30 PM SLST)

  workflow_dispatch:
    inputs:
      signal_key:
        description: 'Signal Key'
        required: true
        default: '3_main'

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install python-telegram-bot requests

      - name: Trigger Signal Event
        run: |
          # UTC Hour එක අනුව අදාළ Signal එක ක්‍රියාත්මක කිරීම
          HOURS=$(date -u +'%H')
          
          case $HOURS in
            06)
              python bot.py 1_warning
              ;;
            07)
              python bot.py 1_main
              ;;
            09)
              python bot.py 1_reset
              python bot.py 2_warning
              ;;
            10)
              python bot.py 2_main
              ;;
            12)
              python bot.py 2_reset
              ;;
            13)
              python bot.py 3_warning
              ;;
            14)
              python bot.py 3_main
              ;;
            16)
              python bot.py 3_reset
              ;;
            *)
              python bot.py ${{ github.event.inputs.signal_key }}
              ;;
          esac
