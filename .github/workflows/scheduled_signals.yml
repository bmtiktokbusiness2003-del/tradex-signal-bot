name: Tradex Telegram Signals Cron

on:
  schedule:
    # 🔴 SOL Signals (07:00 AM - 09:00 AM UTC)
    - cron: '0 6 * * *'   # 06:00 AM UTC - SOL Warning
    - cron: '0 7 * * *'   # 07:00 AM UTC - SOL Main Signal
    - cron: '0 9 * * *'   # 09:00 AM UTC - SOL SIGNAL CLOSED (Reset Site + Post Closed Msg)

    # 🟡 Gold Signals (10:00 AM - 12:00 PM UTC)
    - cron: '0 9 * * *'   # 09:00 AM UTC - Gold Warning
    - cron: '0 10 * * *'  # 10:00 AM UTC - Gold Main Signal
    - cron: '0 12 * * *'  # 12:00 PM UTC - Gold SIGNAL CLOSED (Reset Site + Post Closed Msg)

    # 🔵 BTC Signals (02:00 PM - 04:00 PM UTC)
    - cron: '0 13 * * *'  # 01:00 PM UTC - BTC Warning
    - cron: '0 14 * * *'  # 02:00 PM UTC - BTC Main Signal
    - cron: '0 16 * * *'  # 04:00 PM UTC - BTC SIGNAL CLOSED (Reset Site + Post Closed Msg)

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install python-telegram-bot requests

      # 🔴 SOL Execution
      - name: SOL Warning
        if: github.event.schedule == '0 6 * * *'
        run: python telegram_signal_bot.py 1_warning

      - name: SOL Main Signal
        if: github.event.schedule == '0 7 * * *'
        run: python telegram_signal_bot.py 1_main

      - name: SOL Closed Signal
        if: github.event.schedule == '0 9 * * *'
        run: python telegram_signal_bot.py 1_closed

      # 🟡 Gold Execution
      - name: Gold Warning
        if: github.event.schedule == '0 9 * * *'
        run: python telegram_signal_bot.py 2_warning

      - name: Gold Main Signal
        if: github.event.schedule == '0 10 * * *'
        run: python telegram_signal_bot.py 2_main

      - name: Gold Closed Signal
        if: github.event.schedule == '0 12 * * *'
        run: python telegram_signal_bot.py 2_closed

      # 🔵 BTC Execution
      - name: BTC Warning
        if: github.event.schedule == '0 13 * * *'
        run: python telegram_signal_bot.py 3_warning

      - name: BTC Main Signal
        if: github.event.schedule == '0 14 * * *'
        run: python telegram_signal_bot.py 3_main

      - name: BTC Closed Signal
        if: github.event.schedule == '0 16 * * *'
        run: python telegram_signal_bot.py 3_closed
